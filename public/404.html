<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Matthew Cantor</title>
    <!--
      GitHub Pages SPA fallback (canonical spa-github-pages technique).
      Any deep link (e.g. /work/proptera) 404s on a static host; we stash the
      URL and bounce to the app root, where index.html restores it.

      pathSegmentsToKeep:
        0  -> user/org page   (https://USER.github.io/)        ← default
        1  -> project page    (https://USER.github.io/REPO/)   ← set to 1
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
